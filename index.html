<!DOCTYPE html>
<html lang="id">
<head>

<script defer src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>

<style>
  :root {
    --paper: #F6F4F1; --surface: #FFFFFF; --stone: #E4DED2; --line: #ECE7DE;
    --ink: #151210; --muted: #5C554C; --coral: #F95C4B; --coral-dk: #D23A2C; --coral-ink: #B8392B; --coral-soft: #FFE3DF;
    --green: #0F7A5F; --amber: #B26A00;
    --font: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: only light;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--paper); z-index: 30; }
  button, input, select { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2.5px solid var(--coral-dk); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  svg.i { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex-shrink: 0; }
  .app { max-width: 448px; margin: 0 auto; padding: 14px 16px 124px; }

  .top { display: flex; align-items: center; gap: 10px; }
  .logo { width: 42px; height: 42px; border-radius: 14px; background: var(--coral); color: #fff; display: grid; place-items: center; transform: rotate(-6deg); font-size: 20px; flex-shrink: 0; }
  .brand { flex: 1; min-width: 0; }
  .brand b { display: block; font-size: 21px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; }
  .brand small { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .brand small i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .gear { width: 42px; height: 42px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--muted); font-size: 18px; }

  .page { display: none; } .page.on { display: block; animation: fade .18s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  h1.title { margin: 18px 2px 0; font-size: 26px; font-weight: 900; letter-spacing: -0.03em; }

  .hero { margin-top: 14px; background: var(--coral); color: #fff; border-radius: 28px; padding: 18px 20px; position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; right: -40px; top: -50px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.1); pointer-events: none; }
  .hero .cap { font-size: 13px; font-weight: 700; opacity: .92; display: flex; justify-content: space-between; gap: 8px; }
  .hero .cap span { background: rgba(255,255,255,.2); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .hero .cap span.over { background: rgba(0,0,0,.75); }
  .hero .big { font-size: 34px; font-weight: 900; letter-spacing: -0.035em; line-height: 1.08; margin-top: 2px; }
  .bar { height: 8px; border-radius: 4px; background: rgba(0,0,0,.15); overflow: hidden; margin-top: 10px; }
  .bar i { display: block; height: 100%; background: #fff; border-radius: 4px; }
  .hero .two { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; position: relative; z-index: 1; }
  .hero .two > * { background: rgba(255,255,255,.16); border-radius: 18px; padding: 8px 12px; text-align: left; }
  .hero .two small { display: block; font-size: 12px; opacity: .9; }
  .hero .two b { font-size: 14.5px; font-weight: 800; }

  .stats { margin-top: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stat { background: var(--surface); border-radius: 18px; padding: 10px 12px; }
  .stat small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
  .stat b { display: block; font-size: 15px; font-weight: 800; white-space: nowrap; }
  .stat em { display: block; font-style: normal; font-size: 11.5px; color: var(--muted); }

  .sec { margin: 22px 4px 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .sec h2 { margin: 0; font-size: 16px; font-weight: 800; }
  .sec span, .sec button { font-size: 13px; font-weight: 700; color: var(--muted); }
  .sec button { color: var(--coral-ink); text-decoration: underline; text-underline-offset: 3px; }
  .card { background: var(--surface); border-radius: 24px; padding: 6px 16px; }
  .card.pad { padding: 16px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 0; width: 100%; text-align: left; }
  .row + .row { border-top: 1px solid var(--line); }
  .grow { flex: 1; min-width: 0; }
  .t1 { display: block; font-weight: 700; font-size: 15px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t2 { display: block; font-size: 12.5px; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .amt { font-weight: 800; font-size: 15px; white-space: nowrap; text-align: right; }
  .amt.pos { color: var(--green); }
  .empty { padding: 20px 8px; text-align: center; color: var(--muted); font-size: 14px; }
  .cat { padding: 11px 0; } .cat + .cat { border-top: 1px solid var(--line); }
  .cat .head { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; }
  .cat .head span { font-weight: 700; } .cat .head b { white-space: nowrap; }
  .cat .meter { margin-top: 7px; height: 7px; border-radius: 4px; background: var(--paper); overflow: hidden; }
  .cat .meter i { display: block; height: 100%; border-radius: 4px; background: var(--coral); }
  .cat .meter i.warn { background: var(--amber); } .cat .meter i.over { background: var(--ink); }
  .cat small { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .cat small.over { color: var(--coral-ink); font-weight: 700; }
  .ico { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; flex-shrink: 0; background: var(--coral-soft); color: var(--coral-ink); font-size: 18px; }
  .ico.dark { background: var(--paper); color: var(--ink); }
  .ico.green { background: #DDF3EA; color: var(--green); }

  .seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #E9E3D9; padding: 4px; border-radius: 18px; }
  .seg button { height: 42px; border-radius: 14px; font-weight: 700; font-size: 14.5px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 800; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .mnav { margin-top: 12px; display: flex; align-items: center; gap: 8px; }
  .mbtn { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--muted); flex-shrink: 0; font-size: 15px; }
  .mbtn:disabled { opacity: .3; }
  .mlabel { flex: 1; height: 44px; border-radius: 22px; background: var(--surface); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 15px; }
  .now { font-size: 12px; font-weight: 800; color: var(--coral-ink); background: var(--coral-soft); border-radius: 10px; padding: 2px 8px; }
  .note-bar { margin-top: 10px; background: var(--surface); border-radius: 18px; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .note-bar button { color: var(--coral-ink); font-weight: 800; }
  .bars { display: grid; gap: 8px; align-items: end; height: 130px; margin-top: 12px; }
  .bars .b { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; }
  .bars .b i { display: block; width: 100%; border-radius: 8px; background: var(--coral); min-height: 4px; }
  .bars .b i.dim { background: #F7B2A9; }
  .bars .b span { font-size: 11px; font-weight: 700; color: var(--muted); }
  .bars .b em { font-style: normal; font-size: 11px; font-weight: 800; }
  .split { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; margin-top: 10px; }
  .btns2 { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { height: 50px; border-radius: 18px; font-weight: 800; font-size: 14.5px; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--surface); }
  .btn.main { background: var(--coral-dk); color: #fff; }
  .btn.dark { background: var(--ink); color: #fff; }
  .btn:disabled { opacity: .55; }
  .tools { margin-top: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .tool { height: 66px; border-radius: 18px; background: var(--surface); font-weight: 800; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; }
  .tool svg { font-size: 18px; }
  .tool.main { background: var(--coral-dk); color: #fff; }
  .day { margin: 16px 4px 6px; display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--muted); }

  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 10px); pointer-events: none; }
  .nav-in { pointer-events: auto; max-width: 448px; margin: 0 auto; background: var(--surface); border-radius: 26px; padding: 6px; display: grid; grid-template-columns: 1fr 1fr 76px 1fr 1fr; align-items: center; gap: 2px; box-shadow: 0 10px 30px -8px rgba(0,0,0,.25); }
  .tab { height: 56px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .tab svg { font-size: 19px; }
  .tab[aria-current="page"] { background: var(--coral-soft); color: var(--coral-ink); }
  .fab { justify-self: center; width: 62px; height: 62px; margin-top: -30px; border-radius: 50%; background: var(--coral-dk); color: #fff; border: 4px solid var(--surface); font-size: 24px; display: grid; place-items: center; box-shadow: 0 10px 22px -8px rgba(210,58,44,.6); }

  .scrim { position: fixed; left: 0; right: 0; z-index: 40; background: rgba(21,18,16,.45); display: flex; align-items: flex-end; justify-content: center; padding: 10px; }
  .sheet { width: 100%; max-width: 448px; overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border-radius: 30px; padding: 10px 18px 18px; animation: up .22s cubic-bezier(.2,1.1,.4,1); }
  @keyframes up { from { transform: translateY(26px); opacity: 0; } to { transform: none; opacity: 1; } }
  .grip { width: 42px; height: 5px; border-radius: 3px; background: var(--stone); margin: 0 auto 12px; }
  .sh-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .sh-head h3 { margin: 0; flex: 1; font-size: 20px; font-weight: 900; letter-spacing: -0.03em; }
  .xbtn { width: 38px; height: 38px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; font-size: 15px; }
  .lbl { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 14px 2px 6px; }
  .in, .sel { width: 100%; height: 48px; padding: 0 14px; border-radius: 16px; background: var(--paper); border: 2px solid transparent; font-size: 15px; font-weight: 600; outline: none; }
  .in:focus, .sel:focus { border-color: var(--coral-dk); }
  .sel { appearance: none; -webkit-appearance: none; padding-right: 34px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 19px) 50%, calc(100% - 13px) 50%; background-size: 6px 6px; background-repeat: no-repeat; }
  .money { position: relative; } .money > span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-weight: 800; color: var(--muted); font-size: 14px; pointer-events: none; }
  .money .in { padding-left: 40px; font-weight: 800; font-size: 17px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { height: 38px; padding: 0 14px; border-radius: 999px; background: var(--paper); font-weight: 700; font-size: 13.5px; color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .link { font-size: 13.5px; font-weight: 800; color: var(--coral-ink); }
  .err { margin: 10px 2px 0; font-size: 13px; font-weight: 700; color: var(--coral-ink); }
  .hint { margin: 6px 2px 0; font-size: 12.5px; color: var(--muted); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .dd { position: relative; }
  .dd-btn { width: 100%; min-height: 54px; display: flex; align-items: center; gap: 12px; padding: 6px 12px 6px 8px; border-radius: 16px; background: var(--paper); text-align: left; border: 2px solid transparent; }
  .dd-btn[aria-expanded="true"] { border-color: var(--coral-dk); }
  .dd-ic { width: 36px; height: 36px; border-radius: 12px; background: var(--surface); display: grid; place-items: center; color: var(--coral-ink); font-size: 17px; flex-shrink: 0; }
  .dd-chev { width: 32px; height: 32px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--muted); flex-shrink: 0; transition: transform .15s; }
  .dd-btn[aria-expanded="true"] .dd-chev { transform: rotate(180deg); }
  .dd-panel { margin-top: 6px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; max-height: 300px; overflow-y: auto; overscroll-behavior: contain; box-shadow: 0 12px 26px -16px rgba(0,0,0,.35); }
  .dd-opt { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 12px 9px 8px; text-align: left; min-height: 52px; }
  .dd-opt + .dd-opt { border-top: 1px solid var(--line); }
  .dd-opt .dd-ic { background: var(--paper); }
  .dd-opt[aria-selected="true"] { background: #FFF4F2; }
  .dd-ok { color: var(--coral-dk); font-size: 17px; }
  .seg3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #E9E3D9; padding: 4px; border-radius: 18px; }
  .seg3 button { height: 42px; border-radius: 14px; font-weight: 700; font-size: 14px; color: var(--muted); }
  .seg3 button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 800; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .money.big .in { height: 64px; font-size: 28px; font-weight: 900; padding-left: 48px; }
  .money.big > span { font-size: 18px; left: 16px; }
  .lblrow { display: flex; justify-content: space-between; align-items: baseline; } .lblrow .lbl { margin-bottom: 6px; } .lblrow .link { font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
  .alert { margin-top: 12px; background: var(--coral-soft); color: #7A2419; border-radius: 18px; padding: 12px 14px; font-size: 13.5px; font-weight: 600; display: flex; gap: 10px; }
  .alert svg { font-size: 18px; color: var(--coral-ink); margin-top: 1px; }
  .line { border-radius: 18px; background: var(--paper); padding: 10px; margin-top: 8px; position: relative; }
  .line .in, .line .sel { background: var(--surface); height: 44px; border-radius: 13px; }
  .line .r2 { display: grid; grid-template-columns: minmax(0, 1fr) 118px 32px; gap: 6px; margin-top: 6px; align-items: center; }
  .line .r2 .sel { font-size: 14px; padding-left: 10px; padding-right: 28px; text-overflow: ellipsis; }
  .line .r2 .money .in { font-size: 15.5px; text-align: right; padding-right: 10px; }
  .line .rm { width: 32px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); font-size: 15px; }
  .sugg { position: absolute; left: 10px; right: 10px; top: 56px; z-index: 5; background: var(--surface); border-radius: 14px; box-shadow: 0 12px 30px -10px rgba(0,0,0,.35); overflow: hidden; }
  .sugg button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; text-align: left; font-size: 14.5px; font-weight: 700; }
  .sugg button + button { border-top: 1px solid var(--line); }
  .sugg small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
  .addline { margin-top: 8px; width: 100%; height: 44px; border-radius: 16px; border: 2px dashed var(--stone); font-weight: 800; font-size: 14px; color: var(--muted); }
  .sumrow { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 2px 0; margin-top: 10px; border-top: 1px solid var(--line); }
  .sumrow span { font-size: 14px; font-weight: 700; color: var(--muted); } .sumrow b { font-size: 23px; font-weight: 900; }
  .save { margin-top: 12px; width: 100%; height: 54px; border-radius: 20px; background: var(--coral-dk); color: #fff; font-weight: 800; font-size: 16px; }
  .del { margin-top: 8px; width: 100%; height: 46px; border-radius: 16px; color: var(--coral-ink); font-weight: 800; font-size: 14.5px; }
  .setg { background: var(--paper); border-radius: 20px; overflow: hidden; }
  .setr { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 13px 16px; min-height: 56px; }
  .setr + .setr { border-top: 1px solid #E2DCD1; }
  .setl { margin: 18px 4px 8px; font-size: 13px; font-weight: 800; color: var(--muted); }
  .sw { width: 46px; height: 28px; border-radius: 14px; padding: 3px; background: #C9C1B4; flex-shrink: 0; transition: background .15s; }
  .sw i { display: block; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
  [aria-checked="true"] .sw { background: var(--coral-dk); } [aria-checked="true"] .sw i { transform: translateX(18px); }
  .mp-year { display: flex; align-items: center; justify-content: space-between; background: var(--paper); border-radius: 999px; padding: 4px; }
  .mp-year button { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--muted); }
  .mp-year button:disabled { opacity: .3; }
  .mp-year b { font-size: 18px; font-weight: 900; }
  .mp-grid { margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .mp-grid button { position: relative; height: 48px; border-radius: 16px; background: var(--paper); font-weight: 700; font-size: 14px; }
  .mp-grid button.now { background: var(--coral-soft); color: var(--coral-ink); }
  .mp-grid button.on { background: var(--coral-dk); color: #fff; }
  .mp-grid button:disabled { opacity: .3; }
  .mp-grid button i { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--coral-dk); }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 112px); z-index: 60; background: var(--ink); color: #fff; padding: 8px 8px 8px 16px; min-height: 48px; border-radius: 24px; font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 24px -10px rgba(0,0,0,.6); width: max-content; max-width: calc(100% - 28px); }
  .toast.solo { padding-right: 16px; } .toast.err { background: var(--coral-ink); }
  .toast button { height: 34px; padding: 0 13px; border-radius: 17px; background: rgba(255,255,255,.18); font-weight: 800; flex-shrink: 0; }
  .screen { position: fixed; inset: 0; z-index: 70; background: var(--paper); overflow-y: auto; }
  .screen-in { max-width: 400px; margin: 0 auto; min-height: 100%; padding: 40px 24px 32px; display: flex; flex-direction: column; justify-content: center; }
  .screen h1 { margin: 18px 0 0; font-size: 32px; font-weight: 900; letter-spacing: -0.035em; }
  .screen p { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
  .pin-dots { display: flex; gap: 16px; justify-content: center; margin: 24px 0; }
  .pin-dots i { width: 15px; height: 15px; border-radius: 50%; background: var(--stone); }
  .pin-dots i.on { background: var(--coral-dk); }
  .pin-dots.shake { animation: shake .4s; }
  @keyframes shake { 0%,100% { transform: none; } 25%,75% { transform: translateX(-10px); } 50% { transform: translateX(10px); } }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 300px; margin: 0 auto; width: 100%; }

    <span class="lbl" style="margin-top:24px">Siapa yang memakai HP ini?</span><div class="two">${FAMILY.map(p => `<button class="btn" data-person="${p.email}">${p.name}</button>`).join('')}</div>
    <span class="lbl">Email</span><input class="in" id="lg-email" type="email" autocomplete="username" style="background:#fff">
    <span class="lbl">Kata sandi</span><input class="in" id="lg-pass" type="password" autocomplete="current-password" style="background:#fff">
    <p class="err" id="lg-err" hidden></p><button class="save" id="lg-go">Masuk</button>
    ${hasData && cloud.mode !== 'local' ? '<button class="del" id="lg-back" style="color:var(--ink)">Kembali ke catatan</button>' : ''}
    <button class="del" id="lg-local" style="color:var(--muted);font-weight:600;text-decoration:underline">Pakai di HP ini saja, tanpa sinkron</button></div>`;
  L.hidden = false;
  L.querySelectorAll('[data-person]').forEach(b => b.onclick = () => { L.querySelectorAll('[data-person]').forEach(x => x.classList.toggle('dark', x === b)); $('lg-email').value = b.dataset.person; $('lg-pass').focus(); });
  const goBtn = $('lg-go');
  const doLogin = () => {
    const er = $('lg-err');
    if (!auth) { er.textContent = 'Layanan sinkron belum termuat. Periksa koneksi lalu buka ulang.'; er.hidden = false; return; }
    goBtn.disabled = true; goBtn.textContent = 'Sedang masuk…';
    Promise.race([auth.signInWithEmailAndPassword($('lg-email').value.trim(), $('lg-pass').value), new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), 25000))])
      .then(() => { setMode('cloud'); })
      .catch(e => { er.textContent = loginError(e && e.code); er.hidden = false; })
      .finally(() => { goBtn.disabled = false; goBtn.textContent = 'Masuk'; });
  };
  goBtn.onclick = doLogin; $('lg-pass').addEventListener('keyup', e => { if (e.key === 'Enter') doLogin(); });
  const bk = $('lg-back'); if (bk) bk.onclick = () => { L.hidden = true; render(); };
  $('lg-local').onclick = () => { setMode('local'); L.hidden = true; migrateLocal(); render(); };
}
function stopSync() { unsubs.forEach(u => { try { u(); } catch (e) {} }); unsubs = []; }
let migrating = false, migrationTried = false;
function startSync() {
  stopSync(); cloud.ready = false;
  if (S.receipts.length || S.config.wallets.length) { render(); hideBoot(); }
  let gotCfg = false, gotRec = false;
  const ready = () => { if (gotCfg && gotRec && !cloud.ready) { cloud.ready = true; hideBoot(); render(); } };
  setTimeout(() => { if (!cloud.ready) { cloud.ready = true; hideBoot(); render(); } }, 9000);
  unsubs.push(db.collection('config').doc('main').onSnapshot({ includeMetadataChanges: true }, s => {
    const d = s.exists ? s.data() : {};
    if (s.exists || !s.metadata.fromCache) { S.config = normConfig(Object.assign({}, S.config, d)); cache(); }
    // Data lama (versi 2.x/3.x) belum dipindah: jalankan pemindahan. Juga dicoba saat data berasal dari cache HP.
    if (Number(d.schema) !== 4 && !migrating && !migrationTried) { migrating = true; migrationTried = true; migrateCloud(d).finally(() => { migrating = false; }); }
    gotCfg = true; ready(); if (cloud.ready) render();
  }, e => { console.error(e); if (e && e.code === 'permission-denied') { toast('Akun ini tidak punya akses', null, true); stopSync(); } }));
  unsubs.push(db.collection('receipts').onSnapshot({ includeMetadataChanges: true }, s => {
    cloud.pending = s.metadata.hasPendingWrites;
    if (!(s.empty && s.metadata.fromCache)) { S.receipts = s.docs.map(d => normReceipt(Object.assign({ id: d.id }, d.data()))); cache(); }
    gotRec = true; ready(); if (cloud.ready) render(); else status();
  }, e => { console.error(e); if (e && e.code === 'permission-denied') { cloud.rulesBlocked = true; render(); } }));
}
function signOut() { stopSync(); if (auth) auth.signOut(); toast('Berhasil keluar'); }

// ================= Klik umum =================
document.addEventListener('click', e => {
  if (e.target.closest('#scrim') || e.target.closest('#toast') || e.target.closest('.screen')) {
    const rb = e.target.closest('#scrim [data-receipt]'); if (rb && !rb.onclick) openReceipt(rb.dataset.receipt);
    return;
  }
  const t = e.target.closest('[data-go],[data-act],[data-receipt],[data-wallet],[data-delmove],[data-rmode],[data-rm],[data-ry],[data-pick],[data-openm]'); if (!t) return;
  const d = t.dataset;
  if (d.go) go(d.go);
  else if (d.receipt) openReceipt(d.receipt);
  else if (d.wallet) openWalletInfo(d.wallet);
  else if (d.delmove) { const before = clone(S.config.moves); S.config.moves = S.config.moves.filter(x => x.id !== d.delmove); saveWallets(); render(); toast('Catatan uang dihapus', () => { S.config.moves = before; saveWallets(); }); }
  else if (d.rmode) { rMode = d.rmode; renderRiwayat(); }
  else if (d.rm) { rMonth = d.rm === 'now' ? curMonth() : shiftM(rMonth, Number(d.rm)); renderRiwayat(); }
  else if (d.ry) { rYear = String(Number(rYear) + Number(d.ry)); renderRiwayat(); }
  else if (d.pick) openPicker(d.pick);
  else if (d.openm) { rMonth = d.openm; rMode = 'month'; renderRiwayat(); window.scrollTo({ top: 0 }); }
  else if (d.act === 'budget') openBudget();
  else if (d.act === 'cats') openCats();
  else if (d.act === 'money-in') openMoney('in');
  else if (d.act === 'money-move') openMoney('transfer');
  else if (d.act === 'adjust') openAdjust(null);
  else if (d.act === 'wallet-new') openWalletForm(null);
  else if (d.act === 'mail') sendMail('Laporan Belanja Kita ' + mLabel(rMonth), monthText(rMonth), monthHtml(rMonth));
  else if (d.act === 'share') shareText('Laporan Belanja Kita ' + mLabel(rMonth), monthText(rMonth));
  else if (d.act === 'mail-year') sendMail('Laporan Belanja Kita Tahun ' + rYear, yearText(rYear));
  else if (d.act === 'share-year') shareText('Laporan Belanja Kita Tahun ' + rYear, yearText(rYear));
});

// ================= Mulai =================
let booted = false;
function hideBoot() { if (booted) return; booted = true; const b = $('boot'); if (!b) return; b.classList.add('out'); setTimeout(() => b.remove(), 300); }
setTimeout(hideBoot, 8000);
$('logo').innerHTML = svg('basket'); $('boot-logo').innerHTML = svg('basket');
$('btn-settings').innerHTML = svg('gear'); $('btn-settings').onclick = openSettings;
$('fab').innerHTML = svg('plus', 2.6); $('fab').onclick = () => openPlus();
const NAV = { home: ['basket', 'Belanja'], dompet: ['wallet', 'Dompet'], riwayat: ['chart', 'Riwayat'] };
document.querySelectorAll('.nav .tab[data-go]').forEach(b => { const [ic, n] = NAV[b.dataset.go]; b.innerHTML = svg(ic) + n; });
$('nav-more').innerHTML = svg('dots') + 'Lainnya'; $('nav-more').onclick = openSettings;
window.addEventListener('online', status); window.addEventListener('offline', status);
try {
  if (window.firebase && firebase.initializeApp) {
    firebase.initializeApp(FIREBASE_CONFIG); auth = firebase.auth(); db = firebase.firestore();
    const pp = db.enablePersistence({ synchronizeTabs: true }); if (pp && pp.catch) pp.catch(() => {});
    cloud.available = true;
  }
} catch (e) { console.error(e); }
render();
try { const t = localStorage.getItem(TAB_KEY); if (t && $(t)) go(t); } catch (e) {}
checkBio().then(() => { if (getPin() && !$('lock').hidden) { pinScreen(); autoBio(); } });
if (getPin() && !takeRefresh()) showLock();
if (cloud.mode === 'local') { migrateLocal(); render(); hideBoot(); }
if (cloud.available) {
  auth.onAuthStateChanged(u => {
    cloud.authKnown = true;
    const ok = u && FAMILY.some(f => f.email === String(u.email || '').toLowerCase());
    if (ok) { cloud.user = { email: u.email }; if (cloud.mode === 'local') setMode('cloud'); $('login').hidden = true; startSync(); }
    else { if (u) auth.signOut(); cloud.user = null; stopSync(); if (cloud.mode !== 'local') { if (S.receipts.length || S.config.wallets.length) { hideBoot(); render(); } else showLogin(); } }
    status();
  });
} else if (cloud.mode !== 'local') showLogin();
setInterval(() => { if (!document.hidden) render(); }, 60000);
async function checkUpdate() {
  if (!/^https?:$/.test(location.protocol)) return;
  try { const r = await fetch('./index.html', { cache: 'no-store' }); if (!r.ok) return; const m = (await r.text()).match(/const APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) { const t = $('toast'); t.className = 'toast'; t.innerHTML = '<span>Versi baru tersedia</span><button id="t-reload">Muat ulang</button>'; t.hidden = false; $('t-reload').onclick = () => location.reload(); } } catch (e) {}
}
setTimeout(checkUpdate, 4000);
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.(ai|site)|claudeusercontent/.test(location.hostname)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
window.__bk = { S: () => S, render, go };
})();
</script>

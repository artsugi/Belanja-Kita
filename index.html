<style>
  :root {
    /* Warna utama biru kobalt; merah hanya untuk peringatan */
    --paper: #F5F6F8; --surface: #FFFFFF; --stone: #DDE2EA; --line: #ECEEF2;
    --ink: #111827; --muted: #5B6475; --coral: #2563EB; --coral-dk: #1D4FD8; --coral-ink: #1D4FD8; --coral-soft: #E8EFFF;
    --dark: #1F2937; --green: #15803D; --amber: #B45309; --bad: #DC2626; --bad-ink: #B91C1C; --bad-soft: #FEE2E2;
    --grad: linear-gradient(135deg, #3B7BFF 0%, #2563EB 60%, #1D4FD8 100%);
    --glass: #FFFFFF;
    --glass-b: 1px solid #ECEEF2;
    --glass-sh: 0 4px 14px -10px rgba(16,24,40,0.16);
    --font: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: only light;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: #FFF1EC; z-index: 30; }
  .glow { display: none; }
  .glow i { position: absolute; border-radius: 50%; }
  .glow i:nth-child(1) { left: -60px; top: -80px; width: 300px; height: 300px; background: radial-gradient(circle, rgba(255,138,107,0.55) 0%, rgba(255,138,107,0) 70%); }
  .glow i:nth-child(2) { right: -70px; top: 30px; width: 270px; height: 270px; background: radial-gradient(circle, rgba(255,194,168,0.6) 0%, rgba(255,194,168,0) 70%); }
  .glow i:nth-child(3) { left: -90px; top: 240px; width: 240px; height: 240px; background: radial-gradient(circle, rgba(249,92,75,0.35) 0%, rgba(249,92,75,0) 70%); }
  button, input, select { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2.5px solid var(--coral-dk); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  svg.i { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex-shrink: 0; }
  .app { position: relative; z-index: 1; max-width: 448px; margin: 0 auto; padding: 16px 18px 130px; }

  .top { display: flex; align-items: center; gap: 12px; }
  .logo { width: 44px; height: 44px; border-radius: 15px; background: var(--coral); color: #fff; display: grid; place-items: center; transform: rotate(-6deg); font-size: 22px; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.9); }
  .brand { flex: 1; min-width: 0; }
  .brand small { display: block; font-size: 13px; color: var(--muted); font-weight: 600; }
  .brand b { display: block; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
  .sync { height: 32px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,0.8); border: var(--glass-b); font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .sync i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .sync u { color: var(--coral-ink); }

  .page { display: none; } .page.on { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; animation: fade .18s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .glass { background: var(--glass); border: var(--glass-b); box-shadow: var(--glass-sh); border-radius: 24px; padding: 16px; }
  .glass.tight { padding: 6px 16px; }
  .hero { text-align: center; padding: 18px 16px; border-radius: 26px; }
  .hero .cap { font-size: 14px; font-weight: 700; }
  .hero .big { font-size: 38px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.15; }
  .hero .big small, .bignum small { font-size: 0.5em; font-weight: 700; margin-right: 4px; }
  .track { margin: 12px auto 0; width: 86%; height: 8px; border-radius: 4px; background: #EEF1F5; overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 4px; background: var(--grad); }
  .hero .sub { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; font-weight: 700; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px; }
  .stat { text-align: center; padding: 2px 0; }
  .stat small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
  .stat b { display: block; font-size: 17px; font-weight: 800; margin-top: 2px; white-space: nowrap; }
  .stat em { display: block; font-style: normal; font-size: 11px; font-weight: 800; color: var(--muted); }
  .stat em.bad { color: var(--bad); } .stat em.good { color: var(--green); }
  .quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .quick button { height: 78px; border-radius: 20px; background: var(--glass); border: var(--glass-b); box-shadow: var(--glass-sh); font-size: 12px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; }
  .quick span { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; }
  .insight { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 20px; }
  .insight .ib { width: 36px; height: 36px; border-radius: 12px; background: var(--grad); color: #fff; display: grid; place-items: center; flex-shrink: 0; font-size: 18px; }
  .insight p { margin: 0; flex: 1; font-size: 13.5px; font-weight: 600; line-height: 1.4; }
  .insight b.bad { color: var(--bad); }

  .sec { margin: 4px 4px -4px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .sec h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  .sec span { font-size: 13px; font-weight: 700; color: var(--muted); }
  .sec button { font-size: 13px; font-weight: 700; color: var(--coral-ink); }
  .row { display: flex; align-items: center; gap: 12px; padding: 9px 0; width: 100%; text-align: left; }
  .grow { flex: 1; min-width: 0; }
  .t1 { display: block; font-weight: 700; font-size: 15px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t2 { display: block; font-size: 12.5px; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .amt { font-weight: 800; font-size: 15px; white-space: nowrap; text-align: right; }
  .amt.pos { color: var(--green); }
  .empty { padding: 18px 8px; text-align: center; color: var(--muted); font-size: 14px; }
  .ico { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; flex-shrink: 0; color: #fff; font-size: 20px; }
  .ico.sm { width: 36px; height: 36px; border-radius: 12px; font-size: 18px; }
  .ico.dark { background: var(--coral-soft); color: var(--coral-ink); }
  .more { display: block; width: 100%; text-align: center; padding: 10px 0 4px; font-size: 13px; font-weight: 700; color: var(--coral-ink); }
  .day { margin: 8px 4px -6px; display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--muted); }

  .gauge { position: relative; width: 100%; height: 200px; }
  .gauge svg { display: block; width: 100%; height: 200px; }
  .gauge .c { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; flex-direction: column; align-items: center; }
  .gauge .c small { font-size: 12px; color: var(--muted); font-weight: 600; }
  .gauge .c b { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
  .badge { margin-top: 4px; font-size: 11.5px; font-weight: 800; color: #fff; background: var(--grad); border-radius: 999px; padding: 2px 10px; box-shadow: 0 6px 14px -6px rgba(37,99,235,0.45); }
  .lg { display: flex; align-items: center; gap: 12px; padding: 8px 0; width: 100%; text-align: left; }
  .lg .bar { flex: 1; height: 7px; border-radius: 4px; background: rgba(22,18,15,0.06); overflow: hidden; }
  .lg .bar i { display: block; height: 100%; border-radius: 4px; }
  .lg .sub { margin-top: 6px; display: flex; align-items: center; gap: 8px; }
  .lg .sub span { font-size: 11.5px; font-weight: 800; white-space: nowrap; }
  .pills { display: flex; gap: 4px; background: rgba(255,255,255,0.85); border: var(--glass-b); border-radius: 999px; padding: 4px; box-shadow: 0 8px 20px -14px rgba(201,70,60,0.5); }
  .pills button { flex: 1; height: 36px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .pills button[aria-pressed="true"] { background: var(--grad); color: #fff; font-weight: 800; box-shadow: 0 6px 14px -6px rgba(37,99,235,0.45); }
  .area { margin: 12px -16px -6px; } .area svg { display: block; width: 100%; height: auto; }
  .tag-bad { font-size: 12px; font-weight: 800; color: var(--bad-ink); background: var(--bad-soft); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  .tag-good { font-size: 12px; font-weight: 800; color: #0B6B4C; background: #DDF3EA; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  .ybars { margin-top: 14px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; }
  .ybars button { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px; height: 140px; }
  .ybars i { display: block; width: 100%; border-radius: 999px; }
  .ybars em { font-style: normal; font-size: 9.5px; font-weight: 800; }
  .ybars span { font-size: 11px; font-weight: 600; color: var(--muted); }

  .seg, .seg3 { display: grid; gap: 4px; background: rgba(255,255,255,0.7); border: var(--glass-b); padding: 4px; border-radius: 16px; }
  .seg { grid-template-columns: repeat(2, minmax(0, 1fr)); } .seg3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .seg button, .seg3 button { height: 40px; border-radius: 12px; font-weight: 700; font-size: 14px; color: var(--muted); }
  .seg button[aria-pressed="true"], .seg3 button[aria-pressed="true"] { background: #fff; color: var(--ink); font-weight: 800; box-shadow: 0 2px 8px -2px rgba(16,24,40,0.2); }
  .mnav { display: flex; align-items: center; gap: 8px; }
  .mbtn { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,0.85); border: var(--glass-b); display: grid; place-items: center; flex-shrink: 0; font-size: 15px; }
  .mbtn:disabled { opacity: .35; }
  .mlabel { flex: 1; height: 42px; border-radius: 21px; background: rgba(255,255,255,0.85); border: var(--glass-b); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 15px; }
  .now { font-size: 11.5px; font-weight: 800; color: var(--coral-ink); background: var(--coral-soft); border-radius: 10px; padding: 2px 8px; }
  .bignum { text-align: center; } .bignum small.cap { display: block; font-size: 14px; font-weight: 700; margin: 0; }
  .bignum b { display: block; font-size: 36px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; }
  .bignum span { font-size: 13px; color: var(--muted); font-weight: 600; }
  .btns2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { height: 50px; border-radius: 18px; font-weight: 800; font-size: 14.5px; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--glass); border: var(--glass-b); box-shadow: var(--glass-sh); }
  .btn.main { background: var(--grad); color: #fff; border: 0; box-shadow: 0 12px 24px -12px rgba(37,99,235,0.45); }
  .btn.dark { background: var(--dark); color: #fff; border: 0; }
  .btn:disabled { opacity: .55; }
  .tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .tool { height: 70px; border-radius: 20px; background: var(--glass); border: var(--glass-b); box-shadow: var(--glass-sh); font-weight: 800; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; }
  .tool svg { font-size: 20px; } .tool.main { background: var(--grad); color: #fff; border: 0; }
  .search { height: 50px; border-radius: 18px; background: rgba(255,255,255,0.88); border: var(--glass-b); display: flex; align-items: center; gap: 10px; padding: 0 14px; box-shadow: var(--glass-sh); }
  .search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 15px; }
  .fchips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .fchips button, .fchip { height: 38px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,0.85); border: var(--glass-b); font-size: 13px; font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .fchips button.on { background: var(--grad); color: #fff; border: 0; }
  .act { height: 32px; padding: 0 10px 0 12px; border-radius: 999px; background: var(--coral-soft); color: var(--coral-dk); font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }

  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 0 14px calc(env(safe-area-inset-bottom, 0px) + 12px); pointer-events: none; }
  .nav-in { pointer-events: auto; max-width: 448px; margin: 0 auto; background: rgba(255,255,255,0.86); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border: var(--glass-b); border-radius: 26px; padding: 6px; display: grid; grid-template-columns: 1fr 1fr 74px 1fr 1fr; align-items: center; gap: 2px; box-shadow: 0 14px 34px -12px rgba(22,18,15,0.3); }
  .tab { height: 54px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .tab svg { font-size: 21px; }
  .tab[aria-current="page"] { background: var(--coral-soft); color: var(--coral-ink); font-weight: 800; }
  .fab { justify-self: center; width: 60px; height: 60px; margin-top: -30px; border-radius: 50%; background: var(--grad); color: #fff; border: 4px solid #fff; font-size: 24px; display: grid; place-items: center; box-shadow: 0 12px 22px -8px rgba(249,92,75,0.65); }

  .scrim { position: fixed; left: 0; right: 0; z-index: 40; background: rgba(22,18,15,0.4); display: flex; align-items: flex-end; justify-content: center; padding: 10px; }
  .sheet { width: 100%; max-width: 448px; overflow-y: auto; overscroll-behavior: contain; background: #fff; border-radius: 30px; padding: 10px 18px 18px; animation: up .22s cubic-bezier(.2,1.1,.4,1); }
  .sheet.flush { padding: 0 0 18px; } .sheet.flush > .pad { padding: 0 18px; }
  @keyframes up { from { transform: translateY(26px); opacity: 0; } to { transform: none; opacity: 1; } }
  .grip { width: 42px; height: 5px; border-radius: 3px; background: rgba(22,18,15,0.18); margin: 0 auto 12px; }
  .sh-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .sh-head h3 { margin: 0; flex: 1; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  .xbtn { width: 38px; height: 38px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; font-size: 15px; flex-shrink: 0; }
  .ehead { background: linear-gradient(180deg, #FFF1EC 0%, #FBF7F4 100%); padding: 10px 18px 18px; position: relative; overflow: hidden; }
  .ehead::before { content: ""; position: absolute; left: -60px; top: -70px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(255,138,107,0.45) 0%, rgba(255,138,107,0) 70%); }
  .ehead > * { position: relative; }
  .eamt { text-align: center; margin-top: 12px; } .eamt label { display: block; font-size: 13px; font-weight: 700; }
  .eamt .money { max-width: 300px; margin: 0 auto; } .eamt .money .in { background: transparent; border: 0; height: 60px; text-align: center; font-size: 40px; font-weight: 800; padding: 0 0 0 30px; letter-spacing: -0.03em; }
  .eamt .money > span { font-size: 20px; left: 18%; color: var(--ink); }
  .cgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .cgrid button { height: 82px; border-radius: 18px; background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 4px; font-size: 11.5px; font-weight: 700; line-height: 1.2; text-align: center; }
  .cgrid button svg { font-size: 22px; }
  .cgrid button.on { color: #fff; box-shadow: 0 10px 20px -12px rgba(22,18,15,0.45); }
  .cgrid button.add { background: transparent; border: 1.5px dashed #CBD2DC; color: var(--muted); }
  .sug { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .sug button { height: 38px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #EFE7E1; background: #fff; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .sug button small { font-weight: 600; opacity: .7; margin-left: 6px; font-size: 12px; }
  .lbl { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 14px 2px 6px; }
  .lblrow { display: flex; justify-content: space-between; align-items: baseline; } .lblrow .lbl { margin-bottom: 6px; }
  .in { width: 100%; height: 50px; padding: 0 14px; border-radius: 16px; background: var(--paper); border: 2px solid transparent; font-size: 15px; font-weight: 600; outline: none; }
  .in:focus { border-color: var(--coral-dk); background: #fff; }
  .money { position: relative; } .money > span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-weight: 800; color: var(--muted); font-size: 14px; pointer-events: none; }
  .money .in { padding-left: 40px; font-weight: 800; font-size: 17px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { height: 38px; padding: 0 14px; border-radius: 999px; background: var(--paper); font-weight: 700; font-size: 13.5px; color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--grad); color: #fff; }
  .link { font-size: 13.5px; font-weight: 800; color: var(--coral-ink); }
  .err { margin: 10px 2px 0; font-size: 13px; font-weight: 700; color: var(--bad); }
  .hint { margin: 6px 2px 0; font-size: 12.5px; color: var(--muted); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sumrow { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 2px 0; margin-top: 10px; border-top: 1px solid var(--line); }
  .sumrow span { font-size: 14px; font-weight: 700; color: var(--muted); } .sumrow b { font-size: 22px; font-weight: 800; }
  .save { margin-top: 14px; width: 100%; height: 56px; border-radius: 20px; background: var(--grad); color: #fff; font-weight: 800; font-size: 16px; box-shadow: 0 12px 24px -12px rgba(37,99,235,0.45); }
  .save:disabled { opacity: .6; }
  .del { margin-top: 8px; width: 100%; height: 46px; border-radius: 16px; color: var(--bad); font-weight: 800; font-size: 14.5px; }
  .dd { position: relative; }
  .dd-btn { width: 100%; min-height: 54px; display: flex; align-items: center; gap: 12px; padding: 6px 12px 6px 8px; border-radius: 16px; background: var(--paper); text-align: left; border: 2px solid transparent; }
  .dd-btn[aria-expanded="true"] { border-color: var(--coral-dk); background: #fff; }
  .dd-ic { width: 36px; height: 36px; border-radius: 12px; background: #fff; display: grid; place-items: center; color: var(--coral-ink); font-size: 17px; flex-shrink: 0; }
  .dd-chev { width: 32px; height: 32px; border-radius: 50%; background: #fff; display: grid; place-items: center; color: var(--muted); flex-shrink: 0; transition: transform .15s; }
  .dd-btn[aria-expanded="true"] .dd-chev { transform: rotate(180deg); }
  .dd-panel { margin-top: 6px; background: #fff; border: 1.5px solid #F1E8E2; border-radius: 16px; max-height: 300px; overflow-y: auto; overscroll-behavior: contain; box-shadow: 0 12px 26px -16px rgba(22,18,15,0.35); }
  .dd-opt { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 12px 9px 8px; text-align: left; min-height: 52px; }
  .dd-opt + .dd-opt { border-top: 1px solid var(--line); }
  .dd-opt .dd-ic { background: var(--paper); }

  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button id="t-undo">Batalkan</button>' : ''}`; undoFn = undo || null; t.hidden = false;

if (window.visualViewport) { visualViewport.addEventListener('resize', fitScrim); visualViewport.addEventListener('scroll', fitScrim); }

  $('scrim').hidden = false; fitScrim();

const closeSheet = () => { $('scrim').hidden = true; $('sheet').innerHTML = ''; };
$('scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeSheet(); });

const moneyIn = (id, val, label) => `<div class="money"><span>Rp</span><input class="in num" id="${id}" inputmode="numeric" autocomplete="off" placeholder="0" value="${val ? nf.format(val) : ''}" ${label ? `aria-label="${label}"` : ''}></div>`;

const walletItems = none => (none ? [{ v: '', t: 'Tanpa dompet', icon: 'wallet' }] : []).concat(S.config.wallets.map(w => ({ v: w.id, t: w.name, s: 'Saldo ' + rp(walletBal(w.id)), icon: 'wallet' })));

// ================= Dompet =================

  openSheet(w ? 'Ubah dompet' : 'Dompet baru', `<span class="lbl" style="margin-top:0">Nama dompet</span><input class="in" id="w-name" value="${esc(w ? w.name : '')}" placeholder="Contoh: Tunai, BCA, GoPay">
    <span class="lbl">Saldo awal</span>${moneyIn('w-init', f.initial, 'Saldo awal')}<p class="hint">Isi saldo saat mulai memakai dompet ini.</p>
    <p class="err" id="w-err" hidden></p><button class="save" id="w-save">Simpan</button>${w ? '<button class="del" id="w-del">Hapus dompet</button>' : ''}`, root => {
    bindMoney(root.querySelector('#w-init'), v => { f.initial = v; });
    const err = m => { const e = root.querySelector('#w-err'); e.textContent = m; e.hidden = false; };
    root.querySelector('#w-save').onclick = () => {
      const name = root.querySelector('#w-name').value.trim(); if (!name) return err('Beri nama dompetnya.');
      if (S.config.wallets.some(x => x !== w && x.name.toLowerCase() === name.toLowerCase())) return err('Nama dompet sudah ada.');
      if (w) { w.name = name; w.initial = f.initial; } else { const nw = { id: uid('w'), name, initial: f.initial, createdAt: todayISO() }; S.config.wallets.push(nw); if (S.config.wallets.length === 1) rememberWallet(nw.id); }
      saveWallets(); render(); toast(w ? 'Dompet disimpan' : 'Dompet ' + name + ' ditambahkan'); back ? back() : closeSheet();
    };

  finally { clearTimeout(t); }
}
async function openNetCheck() {
  const L = $('login'), wasHidden = L.hidden; if (!wasHidden) L.hidden = true;
  const rows = [
    ['net', 'Internet di HP ini'], ['sdk', 'Layanan sinkron di aplikasi'], ['auth', 'Server login Google'], ['token', 'Server sesi Google'], ['db', 'Server data Firebase']
  ];
  const res = {};
  const paint = () => openSheet('Cek koneksi', `<p class="hint" style="margin-top:0">Memeriksa server yang dibutuhkan untuk masuk dan sinkron.</p>
    <div class="card" style="background:var(--paper);margin-top:10px">${rows.map(([k, n]) => { const r = res[k]; return `<div class="row"><span class="grow"><span class="t1">${n}</span><span class="t2">${r ? (r.ok ? 'Tersambung' : esc(r.err)) : 'Memeriksa…'}</span></span><b style="font-size:18px;color:${r ? (r.ok ? 'var(--green)' : 'var(--coral-ink)') : 'var(--muted)'}">${r ? (r.ok ? '✓' : '✕') : '…'}</b></div>`; }).join('')}</div>
    ${Object.keys(res).length === rows.length ? advice() : ''}
    <button class="save" id="nc-again">Periksa lagi</button>${!wasHidden ? '<button class="del" id="nc-back" style="color:var(--ink)">Kembali ke layar masuk</button>' : ''}`, root => {
    root.querySelector('#nc-again').onclick = run;
    const bk = root.querySelector('#nc-back'); if (bk) bk.onclick = () => { closeSheet(); showLogin(); };
  });
  const advice = () => {
    if (!res.net.ok) return `<div class="alert">${svg('warn')}<span>HP ini tidak tersambung ke internet. Nyalakan data seluler atau Wi-Fi.</span></div>`;
    if (!res.sdk.ok) return `<div class="alert">${svg('warn')}<span>Layanan sinkron tidak termuat (diambil dari cdn.jsdelivr.net). Tutup aplikasi lalu buka lagi, atau coba jaringan lain. Beberapa jaringan memblokir jsdelivr.</span></div>`;
    if (!res.auth.ok || !res.token.ok) return `<div class="alert">${svg('warn')}<span><b>Server login Google diblokir di jaringan ini.</b> Coba: 1) ganti Wi-Fi ke data seluler atau sebaliknya, 2) Pengaturan HP, Jaringan, <b>DNS Pribadi</b> diatur ke Otomatis atau Nonaktif, 3) matikan VPN atau aplikasi pemblokir iklan, 4) pastikan tanggal dan jam HP otomatis.</span></div>`;
    if (!res.db.ok) return `<div class="alert">${svg('warn')}<span>Server data Firebase tidak bisa dihubungi dari jaringan ini. Coba jaringan lain atau atur DNS Pribadi ke Otomatis.</span></div>`;
    return `<div class="alert" style="background:#DDF3EA;color:#0B4F3E">${svg('check')}<span>Semua server bisa dihubungi. Kalau masuk masih gagal, kemungkinan kata sandinya salah: pakai "Lihat" untuk memeriksa, atau "Lupa kata sandi?".</span></div>`;
  };
  async function run() {
    Object.keys(res).forEach(k => delete res[k]); paint();
    res.net = navigator.onLine === false ? { ok: false, err: 'Offline' } : await probe('https://www.gstatic.com/generate_204', { mode: 'no-cors' }); paint();
    res.sdk = auth ? { ok: true } : { ok: false, err: 'Tidak termuat' }; paint();
    const body = { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' };
    res.auth = await probe('https://identitytoolkit.googleapis.com/v1/accounts:lookup?key=' + FIREBASE_CONFIG.apiKey, body); paint();
    res.token = await probe('https://securetoken.googleapis.com/v1/token?key=' + FIREBASE_CONFIG.apiKey, body); paint();
    res.db = await probe('https://firestore.googleapis.com/v1/projects/' + FIREBASE_CONFIG.projectId + '/databases/(default)/documents/config/main'); paint();
  }
  run();
}
function stopSync() { unsubs.forEach(u => { try { u(); } catch (e) {} }); unsubs = []; }
let migrating = false, migrationTried = false;
function startSync() {
  stopSync(); cloud.ready = false; setTimeout(flushOutbox, 1200);
  if (S.receipts.length || S.config.wallets.length) { render(); hideBoot(); }
  let gotCfg = false, gotRec = false;
  const ready = () => { if (gotCfg && gotRec && !cloud.ready) { cloud.ready = true; hideBoot(); render(); } };
  setTimeout(() => { if (!cloud.ready) { cloud.ready = true; hideBoot(); render(); } }, 9000);
  unsubs.push(db.collection('config').doc('main').onSnapshot({ includeMetadataChanges: true }, s => {
    const d = s.exists ? s.data() : {};
    if (s.exists || !s.metadata.fromCache) { S.config = normConfig(Object.assign({}, S.config, d)); overlayOutbox(); cache(); }
    // Data lama (versi 2.x/3.x) belum dipindah: jalankan pemindahan. Juga dicoba saat data berasal dari cache HP.
    if (Number(d.schema) !== 4 && !migrating && !migrationTried) { migrating = true; migrationTried = true; migrateCloud(d).finally(() => { migrating = false; }); }
    gotCfg = true; ready(); if (cloud.ready) render();
  }, e => { console.error(e); if (e && e.code === 'permission-denied') { toast('Akun ini tidak punya akses', null, true); stopSync(); } }));
  unsubs.push(db.collection('receipts').onSnapshot({ includeMetadataChanges: true }, s => {
    cloud.pending = s.metadata.hasPendingWrites;
    if (!(s.empty && s.metadata.fromCache)) { S.receipts = s.docs.map(d => normReceipt(Object.assign({ id: d.id }, d.data()))); overlayOutbox(); cache(); }
    gotRec = true; ready(); if (cloud.ready) render(); else status();
  }, e => { console.error(e); if (e && e.code === 'permission-denied') { cloud.rulesBlocked = true; render(); } }));
}
function signOut() { if (getOutbox().length) { toast('Masih ada ' + getOutbox().length + ' catatan belum tersinkron. Tunggu sampai terkirim dulu.', null, true); return; } stopSync(); if (auth) auth.signOut(); toast('Berhasil keluar'); }

// ================= Klik umum =================
document.addEventListener('click', e => {
  if (e.target.closest('#scrim') || e.target.closest('#toast') || e.target.closest('.screen')) {
    const rb = e.target.closest('#scrim [data-receipt]'); if (rb && !rb.onclick) openReceipt(rb.dataset.receipt);
    return;
  }
  const t = e.target.closest('[data-go],[data-act],[data-receipt],[data-entry],[data-wallet],[data-delmove],[data-rmode],[data-rm],[data-ry],[data-pick],[data-openm],[data-chart],[data-sm],[data-smx]'); if (!t) return;
  const d = t.dataset;
  if (d.go) go(d.go);
  else if (d.receipt) openReceipt(d.receipt);
  else if (d.entry) { const [rid, li] = d.entry.split(':'); openEntry({ kind: 'buy', rid, li: Number(li) }); }
  else if (d.chart) { chartMode = d.chart; chartSel = null; renderRiwayat(); }
  else if (d.sm) { SM.month = shiftM(SM.month || curMonth(), Number(d.sm)); SM.weeks = []; renderSemua(); }
  else if (d.smx) { const [k, v] = d.smx.split('|'); if (k === 'all') Object.assign(SM, { cats: [], weeks: [], wallets: [], by: [], price: 'all', q: '' }); else if (k === 'price') SM.price = 'all'; else SM[k] = SM[k].filter(x => String(x) !== v); renderSemua(); }
  else if (d.wallet) openWalletInfo(d.wallet);
  else if (d.delmove) { const before = clone(S.config.moves); S.config.moves = S.config.moves.filter(x => x.id !== d.delmove); saveWallets(); render(); toast('Catatan uang dihapus', () => { S.config.moves = before; saveWallets(); }); }
  else if (d.rmode) { rMode = d.rmode; renderRiwayat(); }
  else if (d.rm) { rMonth = d.rm === 'now' ? curMonth() : shiftM(rMonth, Number(d.rm)); chartSel = null; renderRiwayat(); }
  else if (d.ry) { rYear = String(Number(rYear) + Number(d.ry)); renderRiwayat(); }
  else if (d.pick) openPicker(d.pick);
  else if (d.openm) { rMonth = d.openm; rMode = 'month'; renderRiwayat(); window.scrollTo({ top: 0 }); }
  else if (d.act === 'login') showLogin();
  else if (d.act === 'netcheck') openNetCheck();
  else if (d.act === 'all') openAll(curMonth(), 'home');
  else if (d.act === 'all-month') openAll(rMonth, 'riwayat');
  else if (d.act === 'filter') openFilter();
  else if (d.act === 'mail-now') sendMail('Laporan Belanja Kita ' + mLabel(curMonth()), monthText(curMonth()), monthHtml(curMonth()));
  else if (d.act === 'weekbudget') openWeekBudget();
  else if (d.act === 'budget') openBudget();
  else if (d.act === 'cats') openCats();
  else if (d.act === 'money-in') openMoney('in');
  else if (d.act === 'money-move') openMoney('transfer');
  else if (d.act === 'adjust') openAdjust(null);
  else if (d.act === 'wallet-new') openWalletForm(null);
  else if (d.act === 'mail') sendMail('Laporan Belanja Kita ' + mLabel(rMonth), monthText(rMonth), monthHtml(rMonth));
  else if (d.act === 'share') shareText('Laporan Belanja Kita ' + mLabel(rMonth), monthText(rMonth));
  else if (d.act === 'mail-year') sendMail('Laporan Belanja Kita Tahun ' + rYear, yearText(rYear));
  else if (d.act === 'share-year') shareText('Laporan Belanja Kita Tahun ' + rYear, yearText(rYear));
});

// ================= Mulai =================
let booted = false;
function hideBoot() { if (booted) return; booted = true; const b = $('boot'); if (!b) return; b.classList.add('out'); setTimeout(() => b.remove(), 300); }
setTimeout(hideBoot, 8000);
$('logo').innerHTML = svg('basket'); $('boot-logo').innerHTML = svg('basket');
$('fab').innerHTML = svg('plus', 2.6); $('fab').onclick = () => openPlus();
const NAV = { home: ['basket', 'Belanja'], dompet: ['wallet', 'Dompet'], riwayat: ['chart', 'Riwayat'], lainnya: ['dots', 'Lainnya'] };
document.querySelectorAll('.nav .tab[data-go]').forEach(b => { const [ic, n] = NAV[b.dataset.go]; b.innerHTML = svg(ic) + n; });

window.addEventListener('online', () => { status(); flushOutbox(); }); window.addEventListener('offline', status);
try {
  if (window.firebase && firebase.initializeApp) {
    firebase.initializeApp(FIREBASE_CONFIG); auth = firebase.auth(); db = firebase.firestore();
    const pp = db.enablePersistence({ synchronizeTabs: true }); if (pp && pp.catch) pp.catch(() => {});
    cloud.available = true;
  }
} catch (e) { console.error(e); }
render();
try { const t = localStorage.getItem(TAB_KEY); if (t && $(t)) go(t); } catch (e) {}
checkBio().then(() => { if (getPin() && !$('lock').hidden) { pinScreen(); autoBio(); } });
if (getPin() && !takeRefresh()) showLock();
if (cloud.mode === 'local') { migrateLocal(); render(); hideBoot(); }
if (cloud.available) {
  auth.onAuthStateChanged(u => {
    cloud.authKnown = true;
    const ok = u && FAMILY.some(f => f.email === String(u.email || '').toLowerCase());
    if (ok) { cloud.user = { email: u.email }; if (cloud.mode === 'local') setMode('cloud'); $('login').hidden = true; startSync(); }
    else { if (u) auth.signOut(); cloud.user = null; stopSync(); if (cloud.mode !== 'local') { if (S.receipts.length || S.config.wallets.length) { hideBoot(); render(); } else showLogin(); } }
    status();
  });
} else if (cloud.mode !== 'local') showLogin();
setInterval(() => { if (!document.hidden) render(); }, 60000);
async function checkUpdate() {
  if (!/^https?:$/.test(location.protocol)) return;
  try { const r = await fetch('./index.html', { cache: 'no-store' }); if (!r.ok) return; const m = (await r.text()).match(/const APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) { const t = $('toast'); t.className = 'toast'; t.innerHTML = '<span>Versi baru tersedia</span><button id="t-reload">Muat ulang</button>'; t.hidden = false; $('t-reload').onclick = () => location.reload(); } } catch (e) {}
}
setTimeout(checkUpdate, 4000);
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.(ai|site)|claudeusercontent/.test(location.hostname)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
window.__bk = { S: () => S, render, go };
})();
